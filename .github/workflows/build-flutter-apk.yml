# .github/workflows/build-flutter-apk.yml
# Builds the Setup Wizard Flutter APK and uploads it as a GitHub Actions artifact.
#
# The APK is debug-signed (auto-signed with the debug keystore) so it can be
# sideloaded on any Android device without a release keystore.
#
# HOW WE PROTECT lib/main.dart:
# `flutter create` is run in a SEPARATE temp directory (/tmp/temp_flutter),
# then only the generated android/ folder is copied into our project. Our
# committed lib/ source tree is never touched by flutter create at all.
#
# To download the APK:
# 1. Go to the Actions tab on GitHub
# 2. Click the latest "Build Setup Wizard Flutter APK" run
# 3. Scroll down to "Artifacts" → download "setup-wizard-flutter-apk"
#    (or "flutter-build-log" if the build failed, to see the error output)

name: Build Setup Wizard Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android project files (without touching lib/)
        run: |
          # Create a temp project to get the android/ platform files.
          # This never touches our committed flutter_app/lib/ tree.
          flutter create --org com.testplaybyte --project-name setup_wizard --platforms android /tmp/temp_flutter
          # Copy only the android/ directory into our project.
          cp -r /tmp/temp_flutter/android flutter_app/android
          # Fix Kotlin version: 1.7.10 -> 1.9.0 (Flutter 3.24 template ships 1.7.10)
          find flutter_app/android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/1\.7\.10/1.9.0/g' {} \;
          # Fix app label to "Setup Wizard"
          sed -i 's/android:label="setup_wizard"/android:label="Setup Wizard"/' flutter_app/android/app/src/main/AndroidManifest.xml
          # Install dependencies
          cd flutter_app && flutter pub get

      - name: Verify lib/main.dart is our setup wizard (not counter demo)
        run: head -3 flutter_app/lib/main.dart

      - name: Analyze Dart
        working-directory: flutter_app
        run: |
          set +e
          flutter analyze > analyze.log 2>&1
          echo "=== ANALYZE OUTPUT ==="
          cat analyze.log
          # Fail only on errors (errors), not warnings/info.
          if grep -E "error •" analyze.log; then
            echo "::error::Flutter analyze found errors (see log above)"
            exit 1
          fi
          exit 0

      - name: Build debug APK (ARM64 only — smaller, more efficient)
        working-directory: flutter_app
        run: |
          set +e
          flutter build apk --debug --no-tree-shake-icons --target-platform android-arm64 > build-output.log 2>&1
          BUILD_EXIT_CODE=$?
          echo "Build exit code: $BUILD_EXIT_CODE"
          echo "=== LAST 200 LINES OF BUILD LOG ==="
          tail -200 build-output.log
          echo "=== ERROR LINES ==="
          grep -E "^e: |error:|Error:|FAILED|Compilation error|FAILURE:" build-output.log | while read -r line; do
            echo "::error::$line"
          done
          exit $BUILD_EXIT_CODE

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: setup-wizard-flutter-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: |
            flutter_app/build-output.log
            flutter_app/analyze.log
          retention-days: 7
