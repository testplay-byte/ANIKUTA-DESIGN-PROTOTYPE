name: Build ANIKUTA Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Generate Android project files and fix Kotlin version
        run: |
          cd flutter_app
          flutter create --org com.testplaybyte --project-name anikuta --platforms android .
          # Fix Kotlin version everywhere (flutter create uses 1.7.1, need 1.9.0+)
          find android -name "*.gradle" -exec sed -i 's/1\.7\.1/1.9.0/g' {} \;
          sed -i 's/kotlin_version = "1.9.0"/kotlin_version = "1.9.0"/' android/settings.gradle || true
          # Also check settings.gradle.kts if it exists
          sed -i 's/1\.7\.1/1.9.0/g' android/settings.gradle 2>/dev/null || true
          sed -i 's/1\.7\.1/1.9.0/g' android/settings.gradle.kts 2>/dev/null || true
          cat android/settings.gradle || cat android/settings.gradle.kts
          flutter pub get

      - name: Build APK
        run: cd flutter_app && flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anikuta-flutter-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
