name: Build ANIKUTA Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Generate Android project files
        run: |
          cd flutter_app
          flutter create --org com.testplaybyte --project-name anikuta --platforms android .
          # Print what flutter create generated for debugging
          echo "=== settings.gradle ==="
          cat android/settings.gradle 2>/dev/null || echo "not found"
          echo "=== settings.gradle.kts ==="
          cat android/settings.gradle.kts 2>/dev/null || echo "not found"
          # Fix Kotlin version in ALL gradle files (both .gradle and .gradle.kts)
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/1\.7\.1/1.9.0/g' {} \;
          echo "=== after fix ==="
          cat android/settings.gradle 2>/dev/null || cat android/settings.gradle.kts 2>/dev/null
          flutter pub get

      - name: Build APK
        run: cd flutter_app && flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anikuta-flutter-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
