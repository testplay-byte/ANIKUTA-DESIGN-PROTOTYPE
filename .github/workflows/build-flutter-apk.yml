name: Build Setup Wizard Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Generate Android project files (without touching lib/)
        run: |
          # Create a temp project to get android/ files
          flutter create --org com.testplaybyte --project-name setup_wizard --platforms android /tmp/temp_flutter
          # Copy only the android/ directory to our project
          cp -r /tmp/temp_flutter/android flutter_app/android
          # Fix Kotlin version: 1.7.10 -> 1.9.0
          find flutter_app/android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/1\.7\.10/1.9.0/g' {} \;
          # Fix app label to "Setup Wizard"
          sed -i 's/android:label="setup_wizard"/android:label="Setup Wizard"/' flutter_app/android/app/src/main/AndroidManifest.xml
          # Install dependencies
          cd flutter_app && flutter pub get

      - name: Verify main.dart is our setup wizard (not counter app)
        run: head -5 flutter_app/lib/main.dart

      - name: Build APK
        run: cd flutter_app && flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: setup-wizard-flutter-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
