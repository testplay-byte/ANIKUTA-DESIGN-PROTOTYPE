# .github/workflows/build-setup-wizard-apk.yml
# Builds the Setup Wizard APK (ARM64-only) and uploads it as a GitHub
# Actions artifact. The APK is debug-signed (auto-signed with the debug
# keystore) so it can be sideloaded on any ARM64 Android device.
#
# ARM64-only (arm64-v8a): covers 99%+ of modern Android devices and
# produces a significantly smaller APK than the universal build.
# Configured via ndk { abiFilters += "arm64-v8a" } in app/build.gradle.kts.
#
# To download the APK:
# 1. Go to the Actions tab on GitHub
# 2. Click the latest "Build Setup Wizard APK" run
# 3. Scroll down to "Artifacts" → download "setup-wizard-apk"
#    (or "build-log" if the build failed, to see compilation errors)

name: Build Setup Wizard APK

on:
  push:
    branches: [main]
    paths:
      - 'Android_app/SetupWizard/**'
      - '.github/workflows/build-setup-wizard-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK (ARM64-only)
        working-directory: Android_app/SetupWizard
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build-output.log 2>&1
          BUILD_EXIT_CODE=$?
          echo "Build exit code: $BUILD_EXIT_CODE"
          echo "=== LAST 150 LINES OF BUILD LOG ==="
          tail -150 build-output.log
          echo "=== ERROR LINES ==="
          grep -E "^e: |error:|Error:|FAILED|Compilation error" build-output.log | while read -r line; do
            echo "::error::$line"
          done
          exit $BUILD_EXIT_CODE

      - name: Verify APK is ARM64-only
        working-directory: Android_app/SetupWizard
        run: |
          echo "=== APK file ==="
          ls -lh app/build/outputs/apk/debug/*.apk
          echo "=== Native libraries in APK (should be arm64-v8a only) ==="
          unzip -l app/build/outputs/apk/debug/*.apk | grep "\.so$" || echo "(no native libraries — pure Kotlin/Compose)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: setup-wizard-apk
          path: Android_app/SetupWizard/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: Android_app/SetupWizard/build-output.log
          retention-days: 7
